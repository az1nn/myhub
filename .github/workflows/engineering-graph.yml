name: Engineering Graph

on:
  pull_request:
  push:
    branches: [master]

jobs:
  engineering-graph:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:2026.07.1
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
          - 7474:7474

    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Engineering Graph
        run: python -m pip install -e './engineering-graph[test]'

      - name: Test Engineering Graph
        working-directory: engineering-graph
        run: pytest

      - name: Wait for Neo4j Bolt readiness
        run: |
          python - <<'PY'
          import os
          import time
          from neo4j import GraphDatabase

          uri = os.environ["NEO4J_URI"]
          auth = (os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"])

          for _ in range(60):
              driver = GraphDatabase.driver(uri, auth=auth)
              try:
                  driver.verify_connectivity()
                  print("Neo4j Bolt ready")
                  break
              except Exception:
                  time.sleep(1)
              finally:
                  driver.close()
          else:
              raise SystemExit("Neo4j Bolt did not become ready")
          PY

      - name: Sync Engineering Graph
        run: PYTHONPATH=engineering-graph python -m sync.sync --repo-root .

      - name: Validate Engineering Graph
        run: PYTHONPATH=engineering-graph python -m validate.validate --repo-root .
