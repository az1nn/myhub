name: API

on:
  pull_request:
    paths:
      - "services/api/**"
      - "docs/api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [master]
    paths:
      - "services/api/**"
      - "docs/api/**"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: myhub_test
          POSTGRES_USER: myhub
          POSTGRES_PASSWORD: myhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myhub -d myhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://myhub:myhub@127.0.0.1:5432/myhub_test
      MYHUB_DATABASE_URL: postgresql+psycopg://myhub:myhub@127.0.0.1:5432/myhub_test
      MYHUB_BOOTSTRAP_TOKEN: ci-bootstrap-token-that-is-long-enough-123456

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install API
        run: python -m pip install -e './services/api[test]'

      - name: Run migrations
        working-directory: services/api
        run: alembic upgrade head

      - name: Run tests
        run: pytest services/api/tests
