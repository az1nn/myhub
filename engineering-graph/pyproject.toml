[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "myhub-engineering-graph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=6,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools]
packages = ["sync", "validate"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
myhub-graph-sync = "sync.sync:main"
myhub-graph-validate = "validate.validate:main"
